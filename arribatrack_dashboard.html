<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARRIBATRACK</title>

    <!--CSS Stylesheet for Leaflet-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!--Leaflet Routing Machine CSS-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />

    <!--Dashboard CSS-->
    <link rel="stylesheet" href="CSS/dashboard.css">

    <!--Script for Leaflet-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!--Leaflet Routing Machine JS-->
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

    <!-- Mapbox plugin for Leaflet Routing Machine -->
    <script src="https://unpkg.com/lrm-mapbox/dist/lrm-mapbox.js"></script>

    <!--Dashboard JS-->
    <script type="module" src="Javascript/dashboard.js" defer></script>

    <!--Navbar Script-->
    <script src="Javascript/navbar.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
</head>
<body>
    <!--Loading Screen-->
    <div id="auth-loading">
        <p>Loading...</p>
    </div>

    <button id="open_sidebar_button" onclick="openSidebar()">
        <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#c9c9c9"><path d="M153.33-240q-14.16 0-23.75-9.62-9.58-9.61-9.58-23.83 0-14.22 9.58-23.72 9.59-9.5 23.75-9.5h653.34q14.16 0 23.75 9.62 9.58 9.62 9.58 23.83 0 14.22-9.58 23.72-9.59 9.5-23.75 9.5H153.33Zm0-206.67q-14.16 0-23.75-9.61-9.58-9.62-9.58-23.84 0-14.21 9.58-23.71 9.59-9.5 23.75-9.5h653.34q14.16 0 23.75 9.61 9.58 9.62 9.58 23.84 0 14.21-9.58 23.71-9.59 9.5-23.75 9.5H153.33Zm0-206.66q-14.16 0-23.75-9.62-9.58-9.62-9.58-23.83 0-14.22 9.58-23.72 9.59-9.5 23.75-9.5h653.34q14.16 0 23.75 9.62 9.58 9.61 9.58 23.83 0 14.22-9.58 23.72-9.59 9.5-23.75 9.5H153.33Z"/></svg>
    </button>

    <nav id="navbar">
        <ul>
            <li><button id="close_sidebar_button" onclick="closeSidebar()"><svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#c9c9c9"><path d="M480-433.33 274.67-228q-9.67 9.67-23.34 9.67-13.66 0-23.33-9.67-9.67-9.67-9.67-23.33 0-13.67 9.67-23.34L433.33-480 228-685.33q-9.67-9.67-9.67-23.34 0-13.66 9.67-23.33 9.67-9.67 23.33-9.67 13.67 0 23.34 9.67L480-526.67 685.33-732q9.67-9.67 23.34-9.67 13.66 0 23.33 9.67 9.67 9.67 9.67 23.33 0 13.67-9.67 23.34L526.67-480 732-274.67q9.67 9.67 9.67 23.34 0 13.66-9.67 23.33-9.67 9.67-23.33 9.67-13.67 0-23.34-9.67L480-433.33Z"/></svg></button></li>
            <li class="home_li"><a class="active_link" href="arribatrack_dashboard.html">Dashboard</a></li>
            <li><a href="#">Students</a></li>
            <li><a href="#">Settings</a></li>
            <li><button id="logout" class="accent_link">Logout</button></li>
        </ul>
    </nav>
    
    <div id="overlay" onclick="closeSidebar()"></div>

    <div id="map"></div>

  <!-- ── DRIVER PANEL ── -->
  <div id="driver-panel" class="role-panel" style="display: none;">
    <div id="eta-panel">
      <p id="eta-display">Calculating ETA...</p>
    </div>
    <button id="end-trip-button">End Trip</button>
  </div>

  <!-- ── PARENT PANEL ── -->
  <div id="parent-panel" class="role-panel" style="display: none;">
    <div id="driver-info-card">
      <h3 id="driver-name">Driver: —</h3>
      <p id="driver-plate">Plate: —</p>
      <p id="parent-eta-display">ETA: Calculating...</p>
    </div>
  </div>

  <!-- ── ADMIN PANEL ── -->
  <div id="admin-panel" class="role-panel" style="display: none;">
    <div id="admin-tabs">
      <button class="admin-tab active-tab" onclick="switchAdminTab('drivers')">Drivers</button>
      <button class="admin-tab" onclick="switchAdminTab('reports')">Trip Reports</button>
    </div>

    <!-- Drivers Tab -->
    <div id="admin-drivers-tab">
      <h3>Active Drivers</h3>
      <ul id="driver-list"></ul>
    </div>

    <!-- Reports Tab -->
    <div id="admin-reports-tab" style="display: none;">
      <h3>Trip Reports</h3>
      <ul id="reports-list"></ul>
    </div>
  </div>

  <!-- Trip Summary Modal (Driver only) -->
  <div id="trip-summary-modal" style="display: none;">
    <div id="trip-summary-content">
      <h2>Trip Summary</h2>
      <div id="trip-summary-loading">Generating AI summary...</div>
      <div id="trip-summary-text" style="display: none;"></div>
      <button onclick="closeTripSummary()">Close</button>
    </div>
  </div>
</body>
</html>
